<!-- Google Analytics 4 (GA4) Tracking Script -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-F3T5DTHGH8"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  const GA_MEASUREMENT_ID = 'G-F3T5DTHGH8';
  gtag('config', GA_MEASUREMENT_ID, {
    send_page_view: false // Custom route tracking enabled below
  });

  // Track story route navigation via hashchange & popstate
  function trackStoryView() {
    const storyId = window.location.hash || window.location.search || 'root';
    gtag('event', 'page_view', {
      page_title: document.title || 'Storybook Component View',
      page_location: window.location.href,
      page_path: storyId
    });
    console.log('[GA4 Event] Tracked page_view for route:', storyId);
  }

  window.addEventListener('hashchange', trackStoryView);
  window.addEventListener('popstate', trackStoryView);
  window.addEventListener('DOMContentLoaded', trackStoryView);
</script>
