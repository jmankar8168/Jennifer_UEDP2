<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34211A"/>
      <stop offset="100%" stop-color="#1A0F0B"/>
    </linearGradient>
    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EDE6DA"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8C98A"/>
      <stop offset="100%" stop-color="#788554"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base for High Contrast on both Light & Dark Tab Bars -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#788554" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Stylized Editorial Serif 'J' with Ball Terminal -->
  <path d="M 23 18 C 23 16.5 24.8 15.5 28 15.5 L 42 15.5 C 43.8 15.5 45 16.5 45 18 C 45 19.5 43.8 20.5 42 20.5 L 38 20.5 L 38 37 C 38 44.5 32.5 49 25 49 C 18 49 14 44.5 14 40 C 14 37.5 16 35.5 18.5 35.5 C 21 35.5 22.8 37.2 22.8 39.5 C 22.8 42 24.2 44 26.5 44 C 29.5 44 32 41.5 32 37 L 32 20.5 L 28 20.5 C 24.8 20.5 23 19.5 23 18 Z" fill="url(#jGrad)" filter="url(#softGlow)"/>

  <!-- Brand Signature Olive / Gold Sparkle Accent -->
  <path d="M 48 9 C 48 13.2 45.2 15 41.5 15 C 45.2 15 48 16.8 48 21 C 48 16.8 50.8 15 54.5 15 C 50.8 15 48 13.2 48 9 Z" fill="url(#starGrad)"/>
  <circle cx="48" cy="15" r="1.2" fill="#FFFFFF"/>
</svg>